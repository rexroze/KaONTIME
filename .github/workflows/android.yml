name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Publish a GitHub Release under this tag (e.g. v1.0.0). Leave empty to only build an artifact.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: VueActivity
    env:
      API_BASE_URL: https://vueactivity-kaontime-api.vercel.app/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            VueActivity/package-lock.json
            VueActivity/src-capacitor/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        run: |
          # The runner image already ships the Android SDK; installing the
          # legacy "tools" package via android-actions/setup-android fails on
          # images whose cmdline-tools no longer publish it.
          sdkmanager_bin="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          yes | "$sdkmanager_bin" --licenses > /dev/null 2>&1 || true
          "$sdkmanager_bin" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Resolve app version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          tag="$RELEASE_TAG"
          if [[ -z "$tag" && "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          fi
          if [[ -n "$tag" ]]; then
            echo "name=${tag#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=1.0.0" >> "$GITHUB_OUTPUT"
          fi
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Install app dependencies
        run: npm ci

      - name: Install Capacitor platform dependencies
        working-directory: VueActivity/src-capacitor
        run: npm ci

      - name: Point the build at the production API
        run: printf 'VITE_API_BASE_URL=%s\n' "$API_BASE_URL" > .env.prod

      - name: Build Capacitor web assets
        run: npm run sync:android

      - name: Check signing secret
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "No signing keystore configured - producing a debug-signed APK."
          fi

      - name: Decode signing keystore
        if: steps.signing.outputs.has_key == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        if: steps.signing.outputs.has_key == 'true'
        working-directory: VueActivity/src-capacitor/android
        env:
          KAONTIME_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KAONTIME_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KAONTIME_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KAONTIME_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PkaontimeVersionCode="${{ steps.version.outputs.code }}" \
            -PkaontimeVersionName="${{ steps.version.outputs.name }}" \
            -Pandroid.injected.signing.store.file="$KAONTIME_KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KAONTIME_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KAONTIME_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KAONTIME_KEY_PASSWORD"

      - name: Build debug APK
        if: steps.signing.outputs.has_key != 'true'
        working-directory: VueActivity/src-capacitor/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon \
            -PkaontimeVersionCode="${{ steps.version.outputs.code }}" \
            -PkaontimeVersionName="${{ steps.version.outputs.name }}"

      - name: Collect APK
        id: apk
        run: |
          mkdir -p dist-apk
          if [[ -f src-capacitor/android/app/build/outputs/apk/release/app-release.apk ]]; then
            flavor=release
            source=src-capacitor/android/app/build/outputs/apk/release/app-release.apk
          else
            flavor=debug
            source=src-capacitor/android/app/build/outputs/apk/debug/app-debug.apk
          fi
          target="dist-apk/KaONTIME-${{ steps.version.outputs.name }}-${flavor}.apk"
          cp "$source" "$target"
          echo "flavor=$flavor" >> "$GITHUB_OUTPUT"
          echo "path=$target" >> "$GITHUB_OUTPUT"
          ls -lh dist-apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaontime-${{ steps.apk.outputs.flavor }}-apk
          path: VueActivity/dist-apk/*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: KaONTIME ${{ steps.version.outputs.name }}
          files: VueActivity/dist-apk/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
